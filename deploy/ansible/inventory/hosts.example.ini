# =============================================================================
# FoodBridge Platform - Example Ansible Inventory
# =============================================================================
# Replace the placeholder values below with your EC2 public IP and key path.
# You can also generate this automatically using:
#   python scripts/generate-ansible-inventory.py
# =============================================================================

[app_servers]
foodbridge_ec2 ansible_host=YOUR_EC2_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/foodbridge-key.pem

[all:vars]
ansible_python_interpreter=/usr/bin/python3
foodbridge_app_dir=/opt/foodbridge
foodbridge_gateway_port=18080
foodbridge_user=ubuntu
