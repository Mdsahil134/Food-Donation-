---
# Application role handlers
- name: restart foodbridge stack
  ansible.builtin.command:
    cmd: docker compose -f {{ foodbridge_app_dir }}/deploy/docker/docker-compose.yml restart
  changed_when: true

- name: rebuild and restart foodbridge
  ansible.builtin.command:
    cmd: docker compose -f {{ foodbridge_app_dir }}/deploy/docker/docker-compose.yml up --build -d
  changed_when: true
