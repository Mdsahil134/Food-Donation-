---
# Application deployment tasks
- name: Ensure application root directory exists
  ansible.builtin.file:
    path: "{{ foodbridge_app_dir }}"
    state: directory
    owner: "{{ foodbridge_user }}"
    group: "{{ foodbridge_group }}"
    mode: '0775'

- name: Sync FoodBridge application repository
  ansible.builtin.git:
    repo: "{{ foodbridge_repo_url }}"
    dest: "{{ foodbridge_app_dir }}"
    version: "{{ foodbridge_repo_version }}"
    force: yes
  become_user: "{{ foodbridge_user }}"
  notify: rebuild and restart foodbridge

- name: Create deploy/docker directory if missing
  ansible.builtin.file:
    path: "{{ foodbridge_app_dir }}/deploy/docker"
    state: directory
    owner: "{{ foodbridge_user }}"
    group: "{{ foodbridge_group }}"
    mode: '0775'

- name: Deploy environment configuration (.env)
  ansible.builtin.copy:
    dest: "{{ foodbridge_app_dir }}/deploy/docker/.env"
    content: |
      # Auto-generated by Ansible for FoodBridge
      FOODBRIDGE_GATEWAY_PORT={{ foodbridge_gateway_port }}
      FOODBRIDGE_PUBLIC_URL={{ foodbridge_public_url }}
      FOODBRIDGE_CORS={{ foodbridge_cors_origins }}
      POSTGRES_USER={{ foodbridge_db_user }}
      POSTGRES_PASSWORD={{ foodbridge_db_password }}
      JWT_SECRET={{ foodbridge_jwt_secret }}
      INTERNAL_API_KEY={{ foodbridge_internal_api_key }}
      GRAFANA_ADMIN_PASSWORD={{ foodbridge_grafana_admin_password }}
    owner: "{{ foodbridge_user }}"
    group: "{{ foodbridge_group }}"
    mode: '0600'
  notify: restart foodbridge stack

- name: Pull or build and launch FoodBridge Docker containers
  ansible.builtin.command:
    cmd: docker compose --parallel 1 up --build -d
    chdir: "{{ foodbridge_app_dir }}/deploy/docker"
  register: compose_up_result
  changed_when: "'Created' in compose_up_result.stdout or 'Recreated' in compose_up_result.stdout or 'Starting' in compose_up_result.stdout"

- name: Wait for PostgreSQL database to be healthy
  ansible.builtin.command:
    cmd: docker compose exec -T postgres pg_isready -U {{ foodbridge_db_user }}
    chdir: "{{ foodbridge_app_dir }}/deploy/docker"
  register: pg_ready
  until: pg_ready.rc == 0
  retries: "{{ foodbridge_health_retries }}"
  delay: "{{ foodbridge_health_delay }}"
  changed_when: false

- name: Verify FoodBridge Reverse Proxy Gateway health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ foodbridge_gateway_port }}/health"
    method: GET
    return_content: yes
    status_code: 200
  register: gateway_health
  until: gateway_health.status == 200 and 'gateway-ok' in gateway_health.content
  retries: "{{ foodbridge_health_retries }}"
  delay: "{{ foodbridge_health_delay }}"

- name: Verify Auth Service OpenAPI docs endpoint via Gateway
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ foodbridge_gateway_port }}/api/auth/docs/"
    method: GET
    status_code: [200, 301, 302]
  register: auth_docs
  retries: "{{ foodbridge_health_retries }}"
  delay: "{{ foodbridge_health_delay }}"

- name: Print deployment success summary
  ansible.builtin.debug:
    msg:
      - "=========================================================="
      - "FoodBridge Platform successfully deployed!"
      - "Gateway URL : {{ foodbridge_public_url }}"
      - "Gateway Status : OK"
      - "PostgreSQL     : Healthy"
      - "Auth API Docs  : {{ foodbridge_public_url }}/api/auth/docs"
      - "=========================================================="
